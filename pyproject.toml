[project]
name = "schedule-manager"
version = "0.1.0"
description = "A web-based schedule management system."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "psycopg>=3.3.4",
    "sqlalchemy>=2.1.6",
    "greenlet>=3.1.1",
    "pydantic>=2.0",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.2",
    "fastapi[standard]>=0.162.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schedule_manager"]
