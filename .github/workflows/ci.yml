name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build Docker containers
        run: docker compose build

      - name: Run Ruff
        run: docker compose run --rm app ruff check .

  typecheck:
    name: Pyright Type Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build Docker containers
        run: docker compose build

      - name: Run Pyright
        run: docker compose run --rm app pyright

  test:
    name: Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build Docker containers
        run: docker compose build

      - name: Run Tests
        run: docker compose run --rm app pytest tests/
