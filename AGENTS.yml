project: Schedule Manager

before_work:
  - Read docs/CONVENTIONS.md, docs/HOW_TO_DOCUMENTATE.md, tests/HOW_TO_CREATE_TESTS.md, and CONTRIBUTING.md.
  - Inspect the affected source files and tests; inspect migrations for schema changes.
  - Preserve unrelated work in the worktree.

actions:
  - Use uv sync for dependency synchronization.
  - Run relevant tests, Ruff, and Pyright.
  - Review staged changes and follow CONTRIBUTING.md before committing.
